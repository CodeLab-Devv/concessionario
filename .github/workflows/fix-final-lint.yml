name: fix-final-lint
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'trigger final realtime lint fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace remaining realtime any types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/AdminPage.tsx')
          s = p.read_text()
          old_users = "  const handleUsersRealtimeChange=useCallback((payload:any)=>{const row=(payload.new||payload.old) as Record<string,any>;if(!row?.id)return;setEmployees(current=>{if(payload.eventType==='DELETE')return current.filter(item=>item.id!==row.id);const next:EmployeeRevenue={id:String(row.id),name:String(row.name||''),email:String(row.email||''),role:row.role,revenue:0,commission:getDefaultCommission(row.role),availability:(row.availability&&typeof row.availability==='object'?row.availability:{}) as Availability};const existing=current.find(item=>item.id===next.id);return existing?current.map(item=>item.id===next.id?{...item,...next,revenue:item.revenue}:item):[...current,next];});},[]);"
          new_users = "  const handleUsersRealtimeChange = useCallback((payload: RealtimePayload) => { const row = (payload.new || payload.old) as AdminRealtimeRow; const id = adminString(row, 'id'); if (!id) return; setEmployees(current => { if (payload.eventType === 'DELETE') return current.filter(item => item.id !== id); const role = adminString(row, 'role'); const next: EmployeeRevenue = { id, name: adminString(row, 'name'), email: adminString(row, 'email'), role, revenue: 0, commission: getDefaultCommission(role), availability: (typeof row.availability === 'object' && row.availability !== null ? row.availability : {}) as Availability }; const existing = current.find(item => item.id === id); return existing ? current.map(item => item.id === id ? { ...item, ...next, revenue: item.revenue } : item) : [...current, next]; }); }, []);"
          s = s.replace(old_users, new_users, 1)
          old_sales = "  const handleSalesRealtimeChange=useCallback((payload:any)=>{const n=payload.new as Record<string,any>|null;const o=payload.old as Record<string,any>|null;const ni=n?.employee_id?String(n.employee_id):null;const oi=o?.employee_id?String(o.employee_id):null;const nt=Number(n?.total)||0;const ot=Number(o?.total)||0;setEmployees(current=>current.map(employee=>{let d=0;if(payload.eventType==='INSERT'&&employee.id===ni)d=nt;if(payload.eventType==='DELETE'&&employee.id===oi)d=-ot;if(payload.eventType==='UPDATE'){if(employee.id===oi)d-=ot;if(employee.id===ni)d+=nt;}return d?{...employee,revenue:Math.max(0,employee.revenue+d)}:employee;}));},[]);"
          new_sales = "  const handleSalesRealtimeChange = useCallback((payload: RealtimePayload) => { const n = payload.new as AdminRealtimeRow | null; const o = payload.old as AdminRealtimeRow | null; const ni = n ? adminString(n, 'employee_id') : null; const oi = o ? adminString(o, 'employee_id') : null; const nt = n ? adminNumber(n, 'total') : 0; const ot = o ? adminNumber(o, 'total') : 0; setEmployees(current => current.map(employee => { let d = 0; if (payload.eventType === 'INSERT' && employee.id === ni) d = nt; if (payload.eventType === 'DELETE' && employee.id === oi) d = -ot; if (payload.eventType === 'UPDATE') { if (employee.id === oi) d -= ot; if (employee.id === ni) d += nt; } return d ? { ...employee, revenue: Math.max(0, employee.revenue + d) } : employee; })); }, []);"
          s = s.replace(old_sales, new_sales, 1)
          p.write_text(s)

          # Remove temporary workflow files once the source fix is verified.
          for path in ['.github/workflows/fix-lint-realtime-types.yml', '.github/workflows/fix-admin-unused.yml', '.github/workflows/fix-final-lint.yml']:
              if path != '.github/workflows/fix-final-lint.yml':
                  Path(path).unlink(missing_ok=True)
          PY
          npm ci --silent
          npm run lint
          npm run build
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-final-lint.yml
          git add src .github/workflows/fix-lint-realtime-types.yml .github/workflows/fix-admin-unused.yml .github/workflows/fix-final-lint.yml
          git commit -m 'fix: clean realtime lint errors'
          git push
