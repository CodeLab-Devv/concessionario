name: apply dashboard sales patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Dashboard.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/Dashboard.tsx')
          s = p.read_text()
          s = s.replace('Commissioni Totali', 'Stipendio Totale', 1)
          old = """      const { error } = await supabase.from('sales').insert({ employee_id: sale.employeeId, employee_name: sale.employeeName, item_name: sale.itemName, car_model: sale.carModel, price: sale.price, quantity: sale.quantity, total: sale.total, date: sale.date, type: sale.type, category: sale.category }).select().single();\n      if (error) { console.error('Error adding sale:', error); return; }\n"""
          new = """      const { data: insertedSale, error } = await supabase.from('sales').insert({ employee_id: sale.employeeId, employee_name: sale.employeeName, item_name: sale.itemName, car_model: sale.carModel, price: sale.price, quantity: sale.quantity, total: sale.total, date: sale.date, type: sale.type, category: sale.category }).select().single();\n      if (error) { console.error('Error adding sale:', error); return; }\n      if (insertedSale) {\n        const newSale: Sale = {\n          id: insertedSale.id,\n          employeeId: insertedSale.employee_id,\n          employeeName: insertedSale.employee_name,\n          itemName: insertedSale.item_name,\n          carModel: insertedSale.car_model,\n          price: insertedSale.price,\n          quantity: insertedSale.quantity,\n          total: insertedSale.total,\n          date: insertedSale.date,\n          type: insertedSale.type,\n          category: insertedSale.category,\n          created_at: insertedSale.created_at || new Date().toISOString(),\n        };\n        setSales(current => sortSalesByCreatedAt(current.some(item => item.id === newSale.id) ? current : [newSale, ...current]));\n        setSalesPage(1);\n      }\n"""
          if old not in s:
              raise SystemExit('Expected handleAddSale insert block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit Dashboard patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Dashboard.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(dashboard): update sales instantly'
          git push
