name: fix immediate email change

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply email patch
        run: python3 scripts/patch_profile_email.py
      - name: Remove temporary patch files
        run: rm -f .github/workflows/fix-immediate-email-change.yml scripts/patch_profile_email.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/modals/ProfileModal.tsx .github/workflows/fix-immediate-email-change.yml scripts/patch_profile_email.py
          if git diff --cached --quiet; then
            echo 'No changes detected.'
            exit 0
          fi
          git commit -m 'fix(profile): make email changes immediate'
          git push
