name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize realtime types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/components/AdminPage.tsx': {
                  'role:row.role ?? \'\'': "role: String(row.role || '')",
                  "getDefaultCommission(row.role ?? '')": "getDefaultCommission(String(row.role || ''))",
              },
              'src/components/Dashboard.tsx': {
                  'role:nextRow.role ?? \'\'': "role: String(nextRow.role || '')",
              },
          }

          role_path = Path('src/context/AuthContext.tsx')
          role_text = role_path.read_text()
          old_role_block = """      const { error } = await supabase
        .from('users')
        .update({ role: newRole })
        .eq('id', userId);

      if (error) throw error;
"""
          new_role_block = """      const { data: updatedRoleRow, error } = await supabase
        .from('users')
        .update({ role: newRole })
        .eq('id', userId)
        .select('id, role')
        .single();

      if (error) throw error;
      if (!updatedRoleRow || updatedRoleRow.role !== newRole) {
        throw new Error('Il nuovo ruolo non è stato persistito nel database.');
      }

      setEmployees(prev => prev.map(emp =>
        emp.id === userId ? { ...emp, role: newRole } : emp
      ));
"""
          if old_role_block in role_text:
              role_path.write_text(role_text.replace(old_role_block, new_role_block, 1))

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in mapping.items():
                  text = text.replace(old, new)
              path.write_text(text)

          shift_path = Path('src/components/ShiftsPage.tsx')
          shift_text = shift_path.read_text()
          shift_replacements = [
              (
                  """interface Shift {\n  id: string;\n  user_id: string;\n  shift_date: string;\n  start_time: string;\n  end_time: string;\n  notes: string | null;\n}\n""",
                  """interface Shift {\n  id: string;\n  user_id: string;\n  shift_date: string;\n  start_time: string;\n  end_time: string;\n  notes: string | null;\n  supervisor_id: string | null;\n}\n"""
              ),
              (
                  """    userIds: [string, string];\n    start: string;\n    end: string;\n    notes: string;\n""",
                  """    userIds: [string, string];\n    supervisorId: string;\n    start: string;\n    end: string;\n    notes: string;\n"""
              ),
              (
                  """    userIds: ['', ''],\n    start: '06:00',\n""",
                  """    userIds: ['', ''],\n    supervisorId: '',\n    start: '06:00',\n"""
              ),
              (
                  """            'id,user_id,shift_date,start_time,end_time,notes',\n""",
                  """            'id,user_id,shift_date,start_time,end_time,notes,supervisor_id',\n"""
              ),
              (
                  """    setForm({\n      slot: slotKey,\n      userIds: [\n        availableUsers[0]?.id ?? '',\n        availableUsers[1]?.id ?? '',\n      ],\n      start: slot.from,\n""",
                  """    setForm({\n      slot: slotKey,\n      userIds: [\n        availableUsers[0]?.id ?? '',\n        availableUsers[1]?.id ?? '',\n      ],\n      supervisorId: '',\n      start: slot.from,\n"""
              ),
              (
                  """      userIds: [\n        pair[0]?.user_id ?? '',\n        pair[1]?.user_id ?? '',\n      ],\n      start:\n""",
                  """      userIds: [\n        pair[0]?.user_id ?? '',\n        pair[1]?.user_id ?? '',\n      ],\n      supervisorId: pair[0]?.supervisor_id ?? '',\n      start:\n"""
              ),
              (
                  """          notes:\n            form.notes.trim() || null,\n          created_by: user?.id ?? null,\n""",
                  """          notes:\n            form.notes.trim() || null,\n          created_by: user?.id ?? null,\n          supervisor_id: form.supervisorId || null,\n"""
              ),
              (
                  """                        start: slot.from,\n                        end: slot.to,\n                      }),\n""",
                  """                        supervisorId: '',\n                        start: slot.from,\n                        end: slot.to,\n                      }),\n"""
              ),
              (
                  """        }\n\n        setSaving(true);\n""",
                  """        }\n\n    if (form.supervisorId) {\n      const supervisor = userMap.get(form.supervisorId);\n      if (!supervisor || !HIGH_ROLES.has(supervisor.role)) {\n        showError('Supervisore non valido', 'Il supervisore deve essere Proprietario, Direttore o Vice Direttore.');\n        return;\n      }\n      if (selectedUsers.includes(form.supervisorId)) {\n        showError('Supervisore non valido', 'Il supervisore deve essere diverso dalle due persone del turno.');\n        return;\n      }\n      if (isUserAbsentInSlot(form.supervisorId, form.slot)) {\n        showWarning('Supervisore assente', 'Il supervisore selezionato è assente in questa fascia.');\n        return;\n      }\n    }\n\n        setSaving(true);\n"""
              ),
              (
                  """                        {absenceRows.length >\n                          0 && (\n""",
                  """                        {rows[0]?.supervisor_id && userMap.get(rows[0].supervisor_id) && (\n                          <div className=\"mt-2 text-xs text-gray-600\">\n                            <span className=\"font-semibold\">Supervisore:</span> {userMap.get(rows[0].supervisor_id)?.name}\n                          </div>\n                        )}\n\n                        {absenceRows.length >\n                          0 && (\n"""
              ),
              (
                  """                  {renderAbsences(\n                    slot.key,\n                  )}\n""",
                  """                  {rows[0]?.supervisor_id && userMap.get(rows[0].supervisor_id) && (\n                    <div className=\"mt-2 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-800\">\n                      <span className=\"font-semibold\">Supervisore:</span> {userMap.get(rows[0].supervisor_id)?.name}\n                    </div>\n                  )}\n\n                  {renderAbsences(\n                    slot.key,\n                  )}\n"""
              ),
          ]
          for old, new in shift_replacements:
              if old not in shift_text:
                  raise SystemExit(f'Missing shift patch block: {old[:80]}')
              shift_text = shift_text.replace(old, new, 1)

          supervisor_block = '''\n              {/* SUPERVISOR */}\n              <label className=\"block\">\n                <span className=\"mb-1.5 block text-sm font-semibold text-gray-700\">Supervisore <span className=\"font-normal text-gray-400\">(opzionale)</span></span>\n                <select value={form.supervisorId} onChange={(event) => setForm((current) => ({ ...current, supervisorId: event.target.value }))} className=\"h-11 w-full rounded-xl border border-gray-200 px-3\">\n                  <option value=\"\">Nessun supervisore</option>\n                  {users.filter((employee) => HIGH_ROLES.has(employee.role) && !form.userIds.includes(employee.id) && !isUserAbsentInSlot(employee.id, form.slot)).map((employee) => (\n                    <option key={employee.id} value={employee.id}>\n                      {employee.name} · {ROLE_LABELS[employee.role] ?? employee.role}\n                    </option>\n                  ))}\n                </select>\n              </label>\n'''
          marker = '              {/* TIME */}\n'
          if supervisor_block.strip() not in shift_text:
              if marker not in shift_text:
                  raise SystemExit('Missing TIME marker for supervisor block')
              shift_text = shift_text.replace(marker, supervisor_block + '\n' + marker, 1)

          shift_path.write_text(shift_text)

          for path in [
              '.github/workflows/fix-lint-realtime-types.yml',
              '.github/workflows/fix-admin-unused.yml',
              '.github/workflows/fix-final-lint.yml',
              '.github/workflows/fix-role-save.yml',
              '.github/workflows/fix-role-persistence.yml',
              '.github/workflows/patch-shift-supervisor.yml',
          ]:
              Path(path).unlink(missing_ok=True)
          Path('.github/shift-supervisor-patch.trigger').unlink(missing_ok=True)
          PY
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit normalized realtime types
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows .github/shift-supervisor-patch.trigger
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clean realtime lint errors'
          git push
