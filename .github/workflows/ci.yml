name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize realtime types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ActivityPage: replace explicit any with a narrow realtime row type.
          p = Path('src/components/ActivityPage.tsx')
          s = p.read_text()
          if 'type RealtimeRow = Record<string, unknown>;' not in s:
              marker = "import { useAuth } from '../context/AuthContext';"
              helper = """\n\ntype RealtimeRow = Record<string, unknown> & {\n  id?: string; employee_id?: string; employee_name?: string; item_name?: string;\n  car_model?: string; price?: number | string; quantity?: number | string; total?: number | string;\n  date?: string; discount_type?: string; created_at?: string;\n};\nconst readString = (row: RealtimeRow, key: keyof RealtimeRow, fallback = ''): string => {\n  const value = row[key];\n  return typeof value === 'string' ? value : fallback;\n};\nconst readNumber = (row: RealtimeRow, key: keyof RealtimeRow, fallback = 0): number => {\n  const value = row[key];\n  return typeof value === 'number' ? value : Number(value) || fallback;\n};\n"""
              s = s.replace(marker, marker + helper, 1)
          s = s.replace('Record<string,any>', 'RealtimeRow')
          p.write_text(s)

          # AdminPage: strongly type realtime payloads.
          p = Path('src/components/AdminPage.tsx')
          s = p.read_text()
          if "type RealtimePayload" not in s:
              s = s.replace("import { useRealtimeSubscription } from '../hooks/useRealtimeSubscription';", "import { useRealtimeSubscription, type RealtimePayload } from '../hooks/useRealtimeSubscription';", 1)
          if 'type AdminRealtimeRow = Record<string, unknown>;' not in s:
              marker = "import { useAuth } from '../context/AuthContext';"
              helper = """\n\ntype AdminRealtimeRow = Record<string, unknown> & {\n  id?: string; name?: string; email?: string; role?: string; employee_id?: string; total?: number | string; availability?: unknown;\n};\nconst adminString = (row: AdminRealtimeRow, key: keyof AdminRealtimeRow, fallback = ''): string => {\n  const value = row[key];\n  return typeof value === 'string' ? value : fallback;\n};\nconst adminNumber = (row: AdminRealtimeRow, key: keyof AdminRealtimeRow, fallback = 0): number => {\n  const value = row[key];\n  return typeof value === 'number' ? value : Number(value) || fallback;\n};\n"""
              s = s.replace(marker, marker + helper, 1)
          s = s.replace('Record<string,any>', 'AdminRealtimeRow')
          s = s.replace('payload:any', 'payload: RealtimePayload')
          p.write_text(s)

          # Dashboard: strongly type realtime row data while preserving existing UI state.
          p = Path('src/components/Dashboard.tsx')
          s = p.read_text()
          if 'type DashboardRealtimeRow = Record<string, unknown>;' not in s:
              marker = "import { useAuth } from '../context/AuthContext';"
              helper = """\n\ntype DashboardRealtimeRow = Record<string, unknown> & {\n  id?: string; employee_id?: string; employee_name?: string; item_name?: string; car_model?: string;\n  price?: number | string; quantity?: number | string; total?: number | string; date?: string;\n  type?: string; category?: string; created_at?: string; name?: string; email?: string; role?: string;\n  employee_type?: string; is_on_service?: boolean | null; last_service_status_change?: string | null; avatar_url?: string | null;\n};\nconst dashboardString = (row: DashboardRealtimeRow, key: keyof DashboardRealtimeRow, fallback = ''): string => {\n  const value = row[key];\n  return typeof value === 'string' ? value : fallback;\n};\nconst dashboardNumber = (row: DashboardRealtimeRow, key: keyof DashboardRealtimeRow, fallback = 0): number => {\n  const value = row[key];\n  return typeof value === 'number' ? value : Number(value) || fallback;\n};\n"""
              s = s.replace(marker, marker + helper, 1)
          s = s.replace('Record<string,any>', 'DashboardRealtimeRow')
          s = s.replace("event.detail||{}", "event.detail as { eventType?: string; new?: DashboardRealtimeRow | null; old?: DashboardRealtimeRow | null }")
          p.write_text(s)

          # Remove temporary repair workflows; the source changes will be committed by this CI run.
          for path in [
              '.github/workflows/fix-lint-realtime-types.yml',
              '.github/workflows/fix-admin-unused.yml',
              '.github/workflows/fix-final-lint.yml',
          ]:
              Path(path).unlink(missing_ok=True)
          PY
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit normalized realtime types
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clean realtime lint errors'
          git push
