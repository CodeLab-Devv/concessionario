name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize realtime types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/components/AdminPage.tsx': {
                  'role:row.role ?? \'\'': "role: String(row.role || '')",
                  "getDefaultCommission(row.role ?? '')": "getDefaultCommission(String(row.role || ''))",
              },
              'src/components/Dashboard.tsx': {
                  'role:nextRow.role ?? \'\'': "role: String(nextRow.role || '')",
              },
              'src/components/modals/ProfileModal.tsx': {
                  '''      const changedEmail = email !== user.email.toLowerCase();
      let emailChangeRequested = false;

      if (changedEmail) {
        if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) {
          throw new Error('Inserisci un indirizzo email valido.');
        }

        const { error: emailError } = await supabase.auth.updateUser({
          email,
          options: {
            emailRedirectTo: window.location.origin,
          },
        });

        if (emailError) {
          throw new Error(`Impossibile cambiare email: ${emailError.message}`);
        }

        emailChangeRequested = true;
      }
''': '''      const changedEmail = email !== user.email.toLowerCase();
      let emailChanged = false;

      if (changedEmail) {
        if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) {
          throw new Error('Inserisci un indirizzo email valido.');
        }

        const { data, error: emailError } = await supabase.functions.invoke('update-own-email', {
          body: { email },
        });

        if (emailError) {
          throw new Error(`Impossibile cambiare email: ${emailError.message}`);
        }

        if (!data?.success) {
          throw new Error(data?.error || 'Impossibile cambiare email.');
        }

        emailChanged = true;
      }
''',
                  "if (!changedProfile && !emailChangeRequested && !changedPassword) {": "if (!changedProfile && !emailChanged && !changedPassword) {",
                  "        email: emailChangeRequested ? user.email : email,": "        email: emailChanged ? email : email || user.email,",
                  '''      if (emailChangeRequested) {
        showSuccess(
          'Conferma richiesta',
          `Abbiamo inviato una email di conferma a ${email}. L'indirizzo verrà cambiato dopo la conferma.`,
        );
      } else {
        showSuccess('Profilo aggiornato', 'Le modifiche sono state salvate correttamente.');
      }
''': "      showSuccess('Profilo aggiornato', 'Le modifiche sono state salvate correttamente.');\n",
              },
          }

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in mapping.items():
                  text = text.replace(old, new)
              path.write_text(text)

          for path in [
              '.github/workflows/fix-lint-realtime-types.yml',
              '.github/workflows/fix-admin-unused.yml',
              '.github/workflows/fix-final-lint.yml',
              '.github/workflows/fix-immediate-email-change.yml',
          ]:
              Path(path).unlink(missing_ok=True)
          PY
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit normalized realtime types
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clean realtime lint errors'
          git push
