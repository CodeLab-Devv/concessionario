name: Patch presence UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply presence UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          modal = Path('src/components/modals/PromoteEmployeeModal.tsx')
          text = modal.read_text(encoding='utf-8')

          text = text.replace(
              "import { User } from '../../types';",
              "import { PresenceStatus, User } from '../../types';",
              1,
          )
          text = text.replace(
              "const ROLE_COLORS: Record<string, string> = { owner: 'bg-red-100 text-red-800', director: 'bg-yellow-100 text-yellow-800', vice_director: 'bg-purple-100 text-purple-800', employee: 'bg-blue-100 text-blue-800', probation: 'bg-orange-100 text-orange-800' };",
              "const ROLE_COLORS: Record<string, string> = { owner: 'bg-red-100 text-red-800', director: 'bg-yellow-100 text-yellow-800', vice_director: 'bg-purple-100 text-purple-800', employee: 'bg-blue-100 text-blue-800', probation: 'bg-orange-100 text-orange-800' };\nconst PRESENCE_META: Record<PresenceStatus, { label: string; dot: string; bg: string; text: string }> = { available: { label: 'Disponibile', dot: 'bg-emerald-500', bg: 'bg-emerald-50', text: 'text-emerald-800' }, inactive: { label: 'Inattivo', dot: 'bg-slate-400', bg: 'bg-slate-50', text: 'text-slate-700' }, busy: { label: 'Occupato', dot: 'bg-amber-500', bg: 'bg-amber-50', text: 'text-amber-800' }, dnd: { label: 'Non disturbare', dot: 'bg-rose-500', bg: 'bg-rose-50', text: 'text-rose-800' }, absent: { label: 'Assente', dot: 'bg-violet-500', bg: 'bg-violet-50', text: 'text-violet-800' } };",
              1,
          )
          text = text.replace(
              "  const [loading, setLoading] = useState(false);",
              "  const [loading, setLoading] = useState(false);\n  const [presenceStatus, setPresenceStatus] = useState<PresenceStatus>(employee?.presenceStatus || (employee?.isOnService ? 'available' : 'inactive'));",
              1,
          )
          text = text.replace(
              "    setAvailability(employee.availability || '');\n    let cancelled = false;",
              "    setAvailability(employee.availability || '');\n    setPresenceStatus(employee.presenceStatus || (employee.isOnService ? 'available' : 'inactive'));\n    let cancelled = false;",
              1,
          )
          text = text.replace(
              "      const { data, error } = await supabase.from('users').select('availability').eq('id', employee.id).maybeSingle();\n      if (!cancelled && !error) setAvailability(data?.availability || '');",
              "      const { data, error } = await supabase.from('users').select('availability,presence_status').eq('id', employee.id).maybeSingle();\n      if (!cancelled && !error) {\n        setAvailability(data?.availability || '');\n        setPresenceStatus(data?.presence_status || (employee.isOnService ? 'available' : 'inactive'));\n      }",
              1,
          )
          text = text.replace(
              "    void loadAvailability();\n    return () => { return () => { cancelled = true; };",
              "    void loadAvailability();\n    return () => { cancelled = true; };",
              1,
          )
          marker = "    void loadAvailability();\n    return () => { cancelled = true; };\n  }, [employee, isOpen]);"
          if marker in text:
              replacement = marker + "\n\n  useEffect(() => {\n    if (!employee?.id || !isOpen) return;\n    const channel = supabase.channel(`employee-presence-${employee.id}`).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'users', filter: `id=eq.${employee.id}` }, (payload) => {\n      const next = payload.new as { presence_status?: PresenceStatus | null };\n      setPresenceStatus(next.presence_status || 'inactive');\n    }).subscribe();\n    return () => { void supabase.removeChannel(channel); };\n  }, [employee?.id, isOpen]);"
              text = text.replace(marker, replacement, 1)

          service_old = "              {['owner', 'director', 'vice_director'].includes(currentUserRole) && employee.role !== 'owner' && <section className=\"rounded-2xl border border-gray-200 bg-white p-3 sm:p-4\"><div className=\"flex items-center justify-between gap-3\"><div className=\"flex min-w-0 items-center gap-2\"><Clock className=\"h-4 w-4 shrink-0 text-yellow-600\" /><div><h4 className=\"text-sm font-bold text-gray-900\">Stato di servizio</h4>{employee.lastServiceStatusChange && <p className=\"truncate text-[10px] text-gray-500 sm:text-xs\">{new Date(employee.lastServiceStatusChange).toLocaleString('it-IT')}</p>}</div></div><span className={`inline-flex shrink-0 items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-bold ${employee.isOnService ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>{employee.isOnService ? <CheckCircle2 className=\"h-3.5 w-3.5\" /> : <XCircle className=\"h-3.5 w-3.5\" />}{employee.isOnService ? 'In servizio' : 'Fuori servizio'}</span></div></section>}"
          service_new = "              {['owner', 'director', 'vice_director'].includes(currentUserRole) && employee.role !== 'owner' && <section className=\"rounded-2xl border border-gray-200 bg-white p-3 sm:p-4\"><div className=\"flex flex-col gap-3\"><div className=\"flex items-center justify-between gap-3\"><div className=\"flex min-w-0 items-center gap-2\"><Clock className=\"h-4 w-4 shrink-0 text-yellow-600\" /><div><h4 className=\"text-sm font-bold text-gray-900\">Stato di servizio</h4>{employee.lastServiceStatusChange && <p className=\"truncate text-[10px] text-gray-500 sm:text-xs\">{new Date(employee.lastServiceStatusChange).toLocaleString('it-IT')}</p>}</div></div><span className={`inline-flex shrink-0 items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-bold ${employee.isOnService ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>{employee.isOnService ? <CheckCircle2 className=\"h-3.5 w-3.5\" /> : <XCircle className=\"h-3.5 w-3.5\" />}{employee.isOnService ? 'In servizio' : 'Fuori servizio'}</span></div><div className={`flex items-center justify-between gap-3 rounded-xl px-3 py-2.5 ${PRESENCE_META[presenceStatus].bg}`}><div className=\"flex min-w-0 items-center gap-2\"><span className={`h-3 w-3 shrink-0 rounded-full ${PRESENCE_META[presenceStatus].dot}`} /><div className=\"min-w-0\"><p className={`text-xs font-bold ${PRESENCE_META[presenceStatus].text}`}>Stato presenza</p><p className=\"truncate text-[10px] text-gray-500\">Sincronizzato in tempo reale</p></div></div><span className={`shrink-0 rounded-full bg-white/80 px-2.5 py-1 text-[11px] font-extrabold ${PRESENCE_META[presenceStatus].text}`}>{PRESENCE_META[presenceStatus].label}</span></div></div></section>}"
          if service_old not in text:
              raise SystemExit('PromoteEmployeeModal service block not found')
          text = text.replace(service_old, service_new, 1)
          modal.write_text(text, encoding='utf-8')

          admin = Path('src/components/AdminPage.tsx')
          text = admin.read_text(encoding='utf-8')
          text = text.replace("id?: string; name?: string; email?: string; role?: string; employee_id?: string; total?: number | string; availability?: unknown;", "id?: string; name?: string; email?: string; role?: string; employee_id?: string; total?: number | string; availability?: unknown; presence_status?: string | null;", 1)
          text = text.replace("  availability: Availability;\n}", "  availability: Availability;\n  presenceStatus: string;\n}\n", 1)
          text = text.replace("availability: (emp.availability && typeof emp.availability === 'object' ? emp.availability : {}) as Availability\n", "availability: (emp.availability && typeof emp.availability === 'object' ? emp.availability : {}) as Availability,\n        presenceStatus: String((emp as { presence_status?: string | null }).presence_status || (emp.is_on_service ? 'available' : 'inactive'))\n", 1)
          text = text.replace("availability:(row.availability&&typeof row.availability==='object'?row.availability:{}) as Availability};", "availability:(row.availability&&typeof row.availability==='object'?row.availability:{}) as Availability, presenceStatus:String(row.presence_status || 'inactive')};", 1)
          marker = "const formatAvailability = (availability: Availability) =>"
          helper = "const PRESENCE_META: Record<string, { label: string; dot: string; bg: string; text: string }> = { available: { label: 'Disponibile', dot: 'bg-emerald-500', bg: 'bg-emerald-50', text: 'text-emerald-800' }, inactive: { label: 'Inattivo', dot: 'bg-slate-400', bg: 'bg-slate-50', text: 'text-slate-700' }, busy: { label: 'Occupato', dot: 'bg-amber-500', bg: 'bg-amber-50', text: 'text-amber-800' }, dnd: { label: 'Non disturbare', dot: 'bg-rose-500', bg: 'bg-rose-50', text: 'text-rose-800' }, absent: { label: 'Assente', dot: 'bg-violet-500', bg: 'bg-violet-50', text: 'text-violet-800' } };\n\n"
          if marker in text and 'const PRESENCE_META:' not in text:
              text = text.replace(marker, helper + marker, 1)
          old = "<div className=\"text-sm font-medium text-gray-900 truncate\">{employee.name}</div><div className=\"text-xs sm:text-sm text-gray-500 truncate\">{employee.email}</div>"
          new = "<div className=\"flex min-w-0 items-center gap-2\"><span className={`h-2.5 w-2.5 shrink-0 rounded-full ${PRESENCE_META[employee.presenceStatus]?.dot || 'bg-slate-400'}`} title={PRESENCE_META[employee.presenceStatus]?.label || 'Inattivo'} /><div className=\"min-w-0\"><div className=\"text-sm font-medium text-gray-900 truncate\">{employee.name}</div><div className=\"text-xs sm:text-sm text-gray-500 truncate\">{employee.email}</div></div></div>"
          if old not in text:
              raise SystemExit('AdminPage employee cell not found')
          text = text.replace(old, new, 1)
          admin.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/patch-presence-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/modals/PromoteEmployeeModal.tsx src/components/AdminPage.tsx .github/workflows/patch-presence-ui.yml
          git commit -m 'feat(presence): show shared status in employee management'
          git push
