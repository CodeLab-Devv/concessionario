name: fix dashboard sales ui

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/Dashboard.tsx')
          s = p.read_text()
          s = s.replace("Commissioni Totali", "Stipendio Totale", 1)
          old = """      const { error } = await supabase.from('sales').insert({ employee_id: sale.employeeId, employee_name: sale.employeeName, item_name: sale.itemName, car_model: sale.carModel, price: sale.price, quantity: sale.quantity, total: sale.total, date: sale.date, type: sale.type, category: sale.category }).select().single();
      if (error) { console.error('Error adding sale:', error); return; }
"""
          new = """      const { data: insertedSale, error } = await supabase.from('sales').insert({ employee_id: sale.employeeId, employee_name: sale.employeeName, item_name: sale.itemName, car_model: sale.carModel, price: sale.price, quantity: sale.quantity, total: sale.total, date: sale.date, type: sale.type, category: sale.category }).select().single();
      if (error) { console.error('Error adding sale:', error); return; }
      if (insertedSale) {
        const newSale: Sale = {
          id: insertedSale.id,
          employeeId: insertedSale.employee_id,
          employeeName: insertedSale.employee_name,
          itemName: insertedSale.item_name,
          carModel: insertedSale.car_model,
          price: insertedSale.price,
          quantity: insertedSale.quantity,
          total: insertedSale.total,
          date: insertedSale.date,
          type: insertedSale.type,
          category: insertedSale.category,
          created_at: insertedSale.created_at || new Date().toISOString(),
        };
        setSales(current => sortSalesByCreatedAt(current.some(item => item.id === newSale.id) ? current : [newSale, ...current]));
        setSalesPage(1);
      }
"""
          if old not in s:
              raise SystemExit('handleAddSale block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-dashboard-sales-ui.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Dashboard.tsx .github/workflows/fix-dashboard-sales-ui.yml
          git commit -m 'fix(dashboard): update sales list immediately'
          git push
