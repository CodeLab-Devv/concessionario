name: Apply requested UI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # 1) Hide salaries for now, while keeping the page/code available for later.
          sidebar = Path('src/components/Sidebar.tsx')
          s = sidebar.read_text()
          s = s.replace("import { Activity, CalendarDays, ChevronLeft, DollarSign, LayoutDashboard, LogOut, Megaphone, Settings } from 'lucide-react';", "import { Activity, CalendarDays, ChevronLeft, LayoutDashboard, LogOut, Megaphone, Settings } from 'lucide-react';")
          s = re.sub(r"\n\s*\.\.\.(canAccessAdmin \? \[\{ id: 'admin', label: 'Stipendi'.*?\}\] : \[\]),", "", s, count=1)
          sidebar.write_text(s)

          # 2) If an old saved admin route is open, move back to dashboard.
          layout = Path('src/components/MainLayout.tsx')
          s = layout.read_text()
          guard = "  useEffect(() => {\n"
          if "currentPage === 'admin'" not in s:
              s = s.replace(guard, guard + "    if (currentPage === 'admin') {\n      setCurrentPage('dashboard');\n      localStorage.setItem('currentPage', 'dashboard');\n      return;\n    }\n\n", 1)
          layout.write_text(s)

          # 3) Announcements: hydrate author avatar/name immediately on Realtime INSERT.
          announcements = Path('src/components/AnnouncementsPage.tsx')
          s = announcements.read_text()
          old = "onInsert: payload => { const row = payload.new as Announcement; setAnnouncements(current => current.some(item => item.id === row.id) ? current : [{ ...row, read: row.author_id === user?.id }, ...current]); },"
          new = """onInsert: payload => {
            const row = payload.new as Announcement;
            const immediateAuthor = row.author_id === user?.id && user
              ? { id: user.id, name: user.name, avatar_url: user.avatar_url, role: user.role }
              : undefined;
            setAnnouncements(current => current.some(item => item.id === row.id)
              ? current
              : [{ ...row, author: immediateAuthor, read: row.author_id === user?.id }, ...current]);
            if (!immediateAuthor && row.author_id) {
              void supabase.from('users').select('id,name,avatar_url,role').eq('id', row.author_id).maybeSingle().then(({ data }) => {
                if (!data) return;
                setAnnouncements(current => current.map(item => item.id === row.id ? { ...item, author: data } : item));
              });
            }
          },"""
          if old in s:
              s = s.replace(old, new, 1)
          announcements.write_text(s)

          # 4) Sales data: never treat an identical model/name as two different labels.
          dashboard = Path('src/components/Dashboard.tsx')
          s = dashboard.read_text()
          s = s.replace("carModel: sale.car_model,", "carModel: sale.car_model && String(sale.car_model).trim().toLowerCase() !== String(sale.item_name).trim().toLowerCase() ? sale.car_model : undefined,")
          s = s.replace("carModel:row.car_model??undefined", "carModel:row.car_model && String(row.car_model).trim().toLowerCase() !== String(row.item_name).trim().toLowerCase() ? String(row.car_model) : undefined")
          # Existing dashboard copy calls the seller a client; use the actual employee who made the sale.
          s = re.sub(r">\s*Cliente\s*<", ">Venduta da<", s)
          s = re.sub(r"\bCliente:\s*", "Venduta da: ", s)
          # When the model is rendered directly, hide it if it duplicates the vehicle name.
          s = s.replace("{sale.carModel || 'N/A'}", "{sale.carModel && sale.carModel.trim().toLowerCase() !== sale.itemName.trim().toLowerCase() ? sale.carModel : '—'}")
          dashboard.write_text(s)

          # 5) Modern, responsive sale-details modal. Seller = employeeName, not customer.
          modal = Path('src/components/modals/ViewSaleModal.tsx')
          modal.write_text(r'''import React from 'react';
import { Sale } from '../../types';
import { X, Car, Euro, Hash, CalendarDays, UserRound, Tag } from 'lucide-react';

interface ViewSaleModalProps {
  isOpen: boolean;
  onClose: () => void;
  sale: Sale | null;
}

const euro = (value: number) => new Intl.NumberFormat('it-IT', {
  style: 'currency', currency: 'EUR', maximumFractionDigits: 0
}).format(value);

export const ViewSaleModal: React.FC<ViewSaleModalProps> = ({ isOpen, onClose, sale }) => {
  if (!isOpen || !sale) return null;

  const item = sale.itemName?.trim() || 'Veicolo';
  const model = sale.carModel?.trim();
  const hasModel = Boolean(model && model.toLowerCase() !== item.toLowerCase());
  const date = new Date(sale.created_at || sale.date);

  return (
    <div
      className="fixed inset-0 z-[70] flex items-end justify-center bg-slate-950/65 p-0 backdrop-blur-sm sm:items-center sm:p-4"
      onMouseDown={(event) => event.target === event.currentTarget && onClose()}
      role="dialog"
      aria-modal="true"
      aria-labelledby="sale-details-title"
    >
      <div className="flex max-h-[94dvh] w-full flex-col overflow-hidden rounded-t-[2rem] bg-white shadow-2xl sm:max-w-xl sm:rounded-[2rem]">
        <header className="relative overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-amber-950 px-5 pb-6 pt-5 text-white sm:px-7">
          <div className="absolute -right-12 -top-16 h-40 w-40 rounded-full bg-amber-400/10 blur-2xl" />
          <div className="relative flex items-start justify-between gap-4">
            <div className="flex min-w-0 items-center gap-3">
              <div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-amber-400/15 ring-1 ring-amber-300/20"><Car className="h-6 w-6 text-amber-300" /></div>
              <div className="min-w-0"><p className="text-[10px] font-bold uppercase tracking-[0.18em] text-amber-300">Aurum Motors</p><h2 id="sale-details-title" className="mt-1 text-xl font-bold sm:text-2xl">Dettagli vendita</h2></div>
            </div>
            <button type="button" onClick={onClose} aria-label="Chiudi" className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-white/10 text-white/80 hover:bg-white/15 hover:text-white"><X className="h-5 w-5" /></button>
          </div>
          <div className="relative mt-5 rounded-2xl border border-white/10 bg-white/[0.06] p-4">
            <p className="text-[10px] font-bold uppercase tracking-[0.16em] text-white/50">Veicolo venduto</p>
            <p className="mt-1 truncate text-2xl font-extrabold tracking-tight text-white">{item}</p>
            {hasModel && <p className="mt-0.5 truncate text-sm font-medium text-white/60">{model}</p>}
          </div>
        </header>

        <div className="min-h-0 flex-1 overflow-y-auto px-5 py-5 sm:px-7 sm:py-6">
          <div className="grid grid-cols-2 gap-3 sm:grid-cols-3">
            <div className="rounded-2xl border border-slate-100 bg-slate-50 p-4"><Euro className="h-4 w-4 text-emerald-600" /><p className="mt-3 text-[10px] font-bold uppercase tracking-wide text-slate-400">Prezzo</p><p className="mt-1 text-lg font-bold text-slate-900">{euro(sale.price)}</p></div>
            <div className="rounded-2xl border border-slate-100 bg-slate-50 p-4"><Hash className="h-4 w-4 text-indigo-600" /><p className="mt-3 text-[10px] font-bold uppercase tracking-wide text-slate-400">Quantità</p><p className="mt-1 text-lg font-bold text-slate-900">{sale.quantity}</p></div>
            <div className="col-span-2 rounded-2xl border border-emerald-100 bg-emerald-50/70 p-4 sm:col-span-1"><Tag className="h-4 w-4 text-emerald-600" /><p className="mt-3 text-[10px] font-bold uppercase tracking-wide text-emerald-700/60">Totale</p><p className="mt-1 text-xl font-extrabold text-emerald-700">{euro(sale.total)}</p></div>
          </div>

          <div className="mt-4 overflow-hidden rounded-2xl border border-slate-100 bg-white shadow-sm">
            <div className="flex items-center gap-3 border-b border-slate-100 p-4"><div className="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-50 text-amber-600"><UserRound className="h-5 w-5" /></div><div className="min-w-0 flex-1"><p className="text-[10px] font-bold uppercase tracking-wide text-slate-400">Venduta da</p><p className="truncate text-sm font-bold text-slate-900">{sale.employeeName || 'Utente'}</p></div></div>
            <div className="flex items-center gap-3 p-4"><div className="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-100 text-slate-500"><CalendarDays className="h-5 w-5" /></div><div><p className="text-[10px] font-bold uppercase tracking-wide text-slate-400">Data e ora</p><p className="text-sm font-semibold text-slate-900">{date.toLocaleDateString('it-IT')} · {date.toLocaleTimeString('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit' })}</p></div></div>
          </div>
        </div>

        <footer className="border-t border-slate-100 bg-white p-4 sm:p-5"><button type="button" onClick={onClose} className="min-h-12 w-full rounded-xl bg-slate-900 px-4 py-3 text-sm font-bold text-white hover:bg-slate-800">Chiudi</button></footer>
      </div>
    </div>
  );
};
''')

          # 6) Remove this temporary workflow before committing the actual app changes.
          Path('.github/workflows/app-ui-fix.yml').unlink()
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Sidebar.tsx src/components/MainLayout.tsx src/components/AnnouncementsPage.tsx src/components/Dashboard.tsx src/components/modals/ViewSaleModal.tsx .github/workflows/app-ui-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: improve announcements and sales UI'
          git push origin HEAD:main
