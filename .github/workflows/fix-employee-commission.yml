name: fix employee commission dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch commission calculation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/Dashboard.tsx')
          text = path.read_text()
          old = "    const revenue = orderedSales.reduce((sum, sale) => sum + sale.total, 0);"
          new = "    const revenue = orderedSales.reduce((sum, sale) => {\n      const saleValue = Number(sale.total) || 0;\n      const commissionRate = ['employee', 'probation'].includes(user?.role || '') ? 0.10 : 1;\n      return sum + (saleValue * commissionRate);\n    }, 0);"
          if old not in text:
              raise SystemExit('Expected revenue calculation not found')
          text = text.replace(old, new, 1)

          old_label = '<p className=\"text-sm font-semibold text-emerald-700 mb-1\">Fatturato Totale</p>'
          new_label = "<p className=\"text-sm font-semibold text-emerald-700 mb-1\">{['employee', 'probation'].includes(user?.role || '') ? 'Commissioni Totali' : 'Fatturato Totale'}</p>"
          if old_label not in text:
              raise SystemExit('Expected revenue label not found')
          text = text.replace(old_label, new_label, 1)

          old_sub = '<p className=\"text-xs text-emerald-600 font-medium\">Aurum Motors</p>'
          new_sub = "<p className=\"text-xs text-emerald-600 font-medium\">{['employee', 'probation'].includes(user?.role || '') ? '10% di commissione per veicolo' : 'Aurum Motors'}</p>"
          if old_sub not in text:
              raise SystemExit('Expected revenue subtitle not found')
          text = text.replace(old_sub, new_sub, 1)
          path.write_text(text)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-employee-commission.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Dashboard.tsx .github/workflows/fix-employee-commission.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(dashboard): calculate employee commission at 10%'
          git push
