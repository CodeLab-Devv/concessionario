name: Fix dashboard recent sales

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update recent sales UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/Dashboard.tsx')
          text = path.read_text()

          pattern = re.compile(
              r'(?P<indent>\s*)\{\/\* Informazioni Principali \*\/\}.*?'
              r'(?P=indent)\{\/\* Dettagli Finanziari \*\/\}',
              re.S,
          )

          replacement = '''\\g<indent>{/* Informazioni Principali */}
                          <div className="min-w-0 flex-1">
                            <div className="flex items-start gap-3">
                              <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-yellow-500 to-amber-600 shadow-sm">
                                <Car className="h-5 w-5 text-white" />
                              </div>
                              <div className="min-w-0 flex-1">
                                <div className="flex flex-wrap items-center gap-2">
                                  <h3 className="text-base font-extrabold tracking-tight text-gray-900">
                                    {sale.itemName}
                                  </h3>
                                  <span className="rounded-full bg-emerald-50 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wide text-emerald-700">
                                    Venduta
                                  </span>
                                </div>

                                {sale.carModel && sale.carModel.trim().toLowerCase() !== sale.itemName.trim().toLowerCase() && (
                                  <p className="mt-0.5 text-sm font-medium text-gray-500">
                                    {sale.carModel}
                                  </p>
                                )}

                                <div className="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1.5 text-xs text-gray-500">
                                  <span className="inline-flex items-center gap-1.5">
                                    <span className="h-1.5 w-1.5 rounded-full bg-amber-400" />
                                    {new Date(sale.created_at).toLocaleDateString('it-IT', {
                                      timeZone: 'Europe/Rome',
                                      day: '2-digit',
                                      month: '2-digit',
                                      year: 'numeric'
                                    })}
                                    {' · '}
                                    {new Date(sale.created_at).toLocaleTimeString('it-IT', {
                                      timeZone: 'Europe/Rome',
                                      hour: '2-digit',
                                      minute: '2-digit'
                                    })}
                                  </span>
                                  <span className="hidden h-3 w-px bg-gray-200 sm:block" />
                                  <span className="inline-flex items-center gap-1.5">
                                    <span className="h-1.5 w-1.5 rounded-full bg-emerald-500" />
                                    Venduta da <strong className="font-bold text-gray-700">{sale.employeeName || 'Utente'}</strong>
                                  </span>
                                </div>
                              </div>
                            </div>
                          </div>

                          {/* Dettagli Finanziari */}'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Recent sales information block not found')

          path.write_text(updated)
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit fix and remove workflow
        run: |
          rm -f .github/workflows/fix-dashboard-recent-sales.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Dashboard.tsx .github/workflows/fix-dashboard-recent-sales.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: improve recent sales presentation'
          git push origin HEAD:main
