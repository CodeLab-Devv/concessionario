name: Prepare AnimatedIntro image

on:
  push:
    branches: [main]
    paths:
      - 'src/components/AnimatedIntro.tsx'
      - 'public/images/.intro-car-payload/READY'
      - '.github/workflows/prepare-animated-intro-image.yml'

permissions:
  contents: write

jobs:
  prepare-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore generated PNG
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          from base64 import b64decode
          from pathlib import Path
          from PIL import Image

          payload_dir = Path('public/images/.intro-car-payload')
          parts = sorted(payload_dir.glob('part-*.b64'))
          if not parts:
              raise SystemExit('AnimatedIntro image payload is missing.')

          encoded = b''.join(part.read_bytes().strip() for part in parts)
          raw = b64decode(encoded, validate=True)

          source = Path('/tmp/animated-intro.png')
          target = Path('public/images/animated-intro-car.png')
          source.write_bytes(raw)

          with Image.open(source) as image:
              image = image.convert('RGBA')
              image.save(target, format='PNG', optimize=True)

          with Image.open(target) as image:
              image.verify()

          print(f'Created {target} ({target.stat().st_size} bytes)')
          PY

      - name: Finalize one-shot asset migration
        shell: bash
        run: |
          rm -rf public/images/.intro-car-payload

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/animated-intro-car.png
          git add -A public/images/.intro-car-payload
          git rm -f .github/workflows/prepare-animated-intro-image.yml
          git commit -m 'feat: add generated car artwork for AnimatedIntro'
          git push
